<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Review Note app icon</title>
  <desc id="desc">A soft, rounded app icon showing a simple green tree with a visible trunk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#f1ebdd" />
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bd18e" />
      <stop offset="100%" stop-color="#5fa15f" />
