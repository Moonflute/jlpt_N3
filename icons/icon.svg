    <linearGradient id="leafDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aae67" />
      <stop offset="100%" stop-color="#3f7f4d" />
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b624f" />
      <stop offset="100%" stop-color="#5e4033" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#52624b" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <ellipse cx="256" cy="408" rx="132" ry="28" fill="#e7decb" />

